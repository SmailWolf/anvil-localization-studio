name: Windows x64 beta
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/**'
      - 'translations/**'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ggml-org/llama.cpp
          ref: bd4eeaa047006cb1fe71999fbd11134b5836e167
          path: .build/llama.cpp
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-python
            git
            zip
      - name: Build native Windows application and helpers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel 4
      - name: Windows tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --parallel 4
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: engine_cache
        with:
          path: .build/llama-build/bin
          key: windows-ucrt64-gcc16-llama-bd4eeaa-cpu-v1
      - name: Build portable CPU translation engine
        if: steps.engine_cache.outputs.cache-hit != 'true'
        run: |
          cmake -S .build/llama.cpp -B .build/llama-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF \
            -DGGML_OPENMP=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_APP=OFF -DLLAMA_BUILD_UI=OFF
          cmake --build .build/llama-build --target llama-server --parallel 4
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.engine_cache.outputs.cache-hit != 'true'
        with:
          path: .build/llama-build/bin
          key: windows-ucrt64-gcc16-llama-bd4eeaa-cpu-v1
      - name: Assemble Windows runtime package
        run: bash tools/windows/package.sh
      - name: Verify deployed package without MSYS2 on PATH
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'dist/Anvil-Localization-Studio-0.8.0-beta.1-Windows-x64'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_QPA_PLATFORM = 'offscreen'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          $env:QT_COMMAND_LINE_PARSER_NO_GUI_MESSAGE_BOXES = '1'
          function Test-DeployedProcess([string]$file, [string[]]$commandArgs) {
            Write-Host "Checking: $file $commandArgs"
            $stdout = "$file.stdout.log"
            $stderr = "$file.stderr.log"
            $launch = @{ FilePath=$file; PassThru=$true; RedirectStandardOutput=$stdout; RedirectStandardError=$stderr }
            if ($commandArgs.Count -gt 0) { $launch.ArgumentList = $commandArgs }
            $p = Start-Process @launch
            if (-not $p.WaitForExit(30000)) { $p.Kill(); Get-Content $stderr; throw "Deployment check timed out: $file" }
            $p.Refresh()
            if ($p.ExitCode -ne 0) { Get-Content $stderr; throw "Deployment check failed ($($p.ExitCode)): $file" }
            Remove-Item $stdout,$stderr
            $p.Dispose()
          }
          foreach ($lang in @('uk','en')) {
            Test-DeployedProcess "$stage/bin/anvil-studio.exe" @('--ui-language',$lang,'--smoke-test')
          }
          foreach ($tool in @('anvil-extract-wildlands','anvil-extract-breakpoint','anvil-pack-translation')) {
            Test-DeployedProcess "$stage/bin/$tool.exe" @('--help')
          }
          Test-DeployedProcess "$stage/engine/cpu/llama-server.exe" @('--version')
      - name: Deployment diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -Filter '*.log' | ForEach-Object { Get-Content $_.FullName }
          Get-ChildItem dist -Recurse -Filter '*.dll' | Select-Object FullName
      - name: Verify real CPU translation using the pinned model
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p .build/models
          curl --fail --location --retry 3 --output .build/models/translategemma.gguf \
            https://huggingface.co/mradermacher/translategemma-4b-it-GGUF/resolve/d37868f759d2f817a43d28dd80cf9f982ffa62fd/translategemma-4b-it.Q4_K_M.gguf
          printf '%s\n' '81200d03e843d2ec1ece6eeafe7d13cb6e5211e1fcd336ade55790b683a08330  .build/models/translategemma.gguf' | sha256sum --check
          export ANVIL_TRANSLATION_MODEL="$(cygpath -m "$PWD/.build/models/translategemma.gguf")"
          export ANVIL_TRANSLATION_SERVER="$(cygpath -m "$PWD/dist/Anvil-Localization-Studio-0.8.0-beta.1-Windows-x64/engine/cpu/llama-server.exe")"
          export ANVIL_TRANSLATION_REPORT="$(cygpath -m "$PWD/build/real-model")"
          ./build/anvil_translation_tests.exe realModel -o build/real-model-tests.txt,txt
          cat build/real-model-tests.txt
          ./build/anvil_ui_tests.exe realModelPreviewApply -o build/real-model-ui.txt,txt
          cat build/real-model-ui.txt
      - name: Archive distributable and checksums
        run: |
          cd dist
          zip -q -r Anvil-Localization-Studio-0.8.0-beta.1-Windows-x64.zip Anvil-Localization-Studio-0.8.0-beta.1-Windows-x64
          sha256sum Anvil-Localization-Studio-0.8.0-beta.1-Windows-x64.zip > Anvil-Localization-Studio-0.8.0-beta.1-Windows-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Anvil-Windows-x64-beta
          path: |
            dist/*.zip
            dist/*SHA256SUMS.txt
            build/Testing/Temporary/LastTest.log
            build/real-model*.txt
            build/real-model*.json
          if-no-files-found: error
          compression-level: 0
